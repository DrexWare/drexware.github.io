    <div class="container">
        <h1>Reward Unlocked!</h1>
        <p>your key: <strong>moonlight.cc key</strong>.</p>

        

        <div id="key"></div>
    </div>

    <script>
        const SALT = "devkey291872437892";  // MUST MATCH C++!
        

        function tinyHash(str) {
            let h = 0x811c9dc5;
            for (let i = 0; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 0x01000193) >>> 0;
            }
            return h >>> 0;
        }

        function todayYYYYMMDD() {
            const d = new Date();
            return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        }

        function generateKey() {
            const payload = todayYYYYMMDD() + SALT;
            const hash = tinyHash(payload);
            const prefix = ("00000000" + hash.toString(16)).slice(-8).toLowerCase();
            const fullKey = prefix + prefix + prefix + prefix;
    
                const keyDiv = document.getElementById('key');
            keyDiv.innerHTML = `
                <code>${fullKey}</code>
              
            `;
            keyDiv.classList.add('show');
        }

        

        generateKey()

    </script>
